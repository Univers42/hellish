# Try hellish in a clean, dependency-complete container on four distros.
# It builds the shell FROM SOURCE inside each image, so you never fight missing
# readline/ncurses/toolchain on your host -- the container has exactly what is
# needed and nothing else.
#
#   docker compose build                 # build all four images
#   docker compose run --rm alpine       # interactive hellish on Alpine
#   docker compose run --rm arch         # ... or Arch, Debian, Ubuntu
#   make docker-test                     # build + smoke-test every distro
#
# Each service builds with the same docker/Dockerfile, only BASE differs.
name: hellish

services:
  alpine:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE: "alpine:3.20"
    image: hellish:alpine
    tty: true
    stdin_open: true

  debian:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE: "debian:stable-slim"
    image: hellish:debian
    tty: true
    stdin_open: true

  ubuntu:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE: "ubuntu:24.04"
    image: hellish:ubuntu
    tty: true
    stdin_open: true

  # Ubuntu 22.04 LTS pins gcc 11, and gcc 11 is the ONLY compiler in this
  # matrix whose -Wstringop-overflow fires on a va_list forwarded between
  # functions (issue #9). gcc 13 on 24.04 and gcc 14 on Debian stable both
  # stay quiet, so without this rung the whole matrix went green while
  # `make` failed outright for anyone on 22.04 -- which is what WSL installs
  # by default. Keep it: it is the oldest toolchain we claim to support.
  ubuntu2204:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE: "ubuntu:22.04"
    image: hellish:ubuntu2204
    tty: true
    stdin_open: true

  arch:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE: "archlinux:base-devel"
    image: hellish:arch
    tty: true
    stdin_open: true
