name: CI

# Runs on every pull request and on pushes to the long-lived branches.
# Each job below is a separate, required status check on the PR, so a
# contributor sees at a glance what passes and what needs work.
on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same PR/branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELLISH_NO_BANNER: "1"
  HELLISH_NO_UPDATE_CHECK: "1"

jobs:
  # ── Submodules & repo hygiene ────────────────────────────────────────────
  # vendor/libft (the stdlib + ft_malloc) and vendor/scripts are git
  # submodules; the shell cannot build without them. This job also guards
  # against unresolved merge-conflict markers and unparseable shell scripts.
  submodules:
    name: Submodules & hygiene
    runs-on: ubuntu-latest
    steps:
      # checkout's recursive submodule handling rewrites the deep test
      # submodule's git@ URL to https via the token (a raw `git submodule
      # update --init --recursive` can't auth that SSH URL in CI).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Submodules are populated
        run: |
          test -d vendor/libft/srcs || { echo "::error::vendor/libft is empty (its pin points at the mass-deletion main). Pin a full-tree commit."; exit 1; }
          test -e vendor/scripts    || { echo "::error::vendor/scripts is missing"; exit 1; }
          echo "libft @ $(git -C vendor/libft rev-parse --short HEAD) | scripts @ $(git -C vendor/scripts rev-parse --short HEAD)"
      - name: No unresolved merge-conflict markers (main repo)
        run: |
          # Submodules are separate repos with their own CI; we only police our
          # own tracked sources here (src, incs, tests, root).
          hits=$(grep -rlE '^(<<<<<<<|>>>>>>>)' --include='*.c' --include='*.h' --include='*.sh' --include='Makefile' --exclude-dir=vendor --exclude-dir=.git . 2>/dev/null || true)
          if [ -n "$hits" ]; then echo "::error::Unresolved conflict markers in:"; echo "$hits"; exit 1; fi
          echo "clean"
      - name: Shell scripts parse (bash -n, main repo any depth)
        run: |
          bad=0
          for f in $(find . -name '*.sh' -not -path '*/vendor/*' -not -path '*/.git/*' -not -path '*/.claude/*' 2>/dev/null); do
            head -1 "$f" | grep -q python && continue
            grep -qE '^[[:space:]]*(import |def |class )' "$f" && continue
            bash -n "$f" 2>/dev/null || { echo "::error::parse error: $f"; bad=1; }
          done
          [ "$bad" = 0 ] && echo "all .sh parse clean"

  # ── Compilation ──────────────────────────────────────────────────────────
  # Build every supported configuration with -Werror. SAFE selects the
  # allocator (1 = libc, 0 = the custom ft_malloc heap); OPT toggles -O3/LTO.
  build:
    name: Build · ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "debug SAFE=1 (ASan)",     flags: "" }
          - { label: "opt SAFE=0 (ft_malloc)",  flags: "OPT=1" }
          - { label: "opt SAFE=1 (libc)",       flags: "OPT=1 SAFE=1" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev
      - name: Compile
        run: |
          if ! make re ${{ matrix.flags }} > build.log 2>&1; then
            echo "::error::Build failed for ${{ matrix.label }}"
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\x1bc//g; s/\r/\n/g' build.log | tail -120
            exit 1
          fi
          test -x build/bin/hellish && echo "✓ built ${{ matrix.label }}"

  # ── Oldest supported toolchain ───────────────────────────────────────────
  # ubuntu-latest tracks a recent gcc, and a warning that only the OLD
  # compiler emits therefore never reaches CI. That is exactly how issue #9
  # shipped: gcc 11's -Wstringop-overflow rejected a va_list forwarded
  # between functions, so `make` failed outright on Ubuntu 22.04 -- the
  # default WSL distribution -- while gcc 13 and gcc 14 compiled it in
  # silence and every job here stayed green.
  #
  # This job pins the oldest toolchain we claim to support and builds the
  # full matrix with it. `make docker-test` covers the same ground locally
  # through the `ubuntu2204` compose service.
  toolchain:
    name: Oldest toolchain · ${{ matrix.cc }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,    label: "debug SAFE=1",  flags: "" }
          - { cc: gcc,    label: "opt SAFE=0",    flags: "OPT=1" }
          - { cc: gcc,    label: "opt SAFE=1",    flags: "OPT=1 SAFE=1" }
          - { cc: gcc-12, label: "opt SAFE=1",    flags: "OPT=1 SAFE=1" }
          - { cc: clang,  label: "opt SAFE=1",    flags: "OPT=1 SAFE=1" }
    steps:
      # git has to exist before checkout, otherwise the action falls back to
      # a tarball download and the submodules never arrive.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libreadline-dev git ca-certificates ${{ matrix.cc }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile with ${{ matrix.cc }}
        env:
          CC: ${{ matrix.cc }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          $CC --version | head -1
          if ! make re ${{ matrix.flags }} CC=$CC > build.log 2>&1; then
            echo "::error::Build failed with $CC (${{ matrix.label }})"
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\x1bc//g; s/\r/\n/g' build.log | tail -120
            exit 1
          fi
          test -x build/bin/hellish
          ./build/bin/hellish -c 'printf "%s|%*d|%.*s\n" ok 5 42 2 abcdef'

  # ── 42 Norm ──────────────────────────────────────────────────────────────
  norm:
    name: 42 Norm (norminette)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install norminette
        run: pip install --quiet norminette==3.3.59
      - name: norminette src incs
        run: |
          # norminette exits non-zero on NOTICES too (e.g. GLOBAL_VAR_DETECTED on
          # the banner's const tables, UNKNOWN_ESCAPE on \033 art) -- those are
          # warnings, not 42-norm violations. Fail only on real errors, exactly
          # like `make norm`.
          norminette src incs 2>&1 | tee norm.out || true
          if grep -qE 'Error!|: KO|Error: ' norm.out; then
            echo "::error::Norm violations -- run 'make norm' locally. See CONTRIBUTING.md."
            grep -E 'Error!|Error: ' norm.out
            exit 1
          fi
          echo "norm clean (real errors: 0; notices ignored, matching make norm)"

  # ── Tests ────────────────────────────────────────────────────────────────
  # The debug build (SAFE=1) is used so AddressSanitizer / LeakSanitizer are
  # meaningful. Two layers: the ~2481-case unit suite (diffed against
  # `bash --posix`), and the self-contained script corpus + leak check.
  #
  # The golden oracle is a PINNED bash (5.3.9), built once and cached: the
  # suite diffs hellish against whatever `bash` is first in PATH, and the
  # runner's distro bash drifts (24.04 ships 5.2) — 5.2 vs 5.3 disagree on
  # ~30 cases, which shows up here as phantom hellish failures.
  tests:
    name: Tests · suite + scripts + leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev
      - uses: ./.github/actions/oracle
      - name: Build debug (SAFE=1, ASan)
        run: |
          if ! make re > build.log 2>&1; then
            echo "::error::Build failed"
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r/\n/g' build.log | tail -120
            exit 1
          fi
      - name: Unit suite vs bash --posix
        run: |
          cd tests
          ./tester 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee ../suite.log | grep -E 'PASSED|FAIL' | tail -3
          grep -q 'ALL [0-9]* TESTS PASSED' ../suite.log || { echo "::error::Unit suite has failures"; exit 1; }
      - name: Upload suite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log
          if-no-files-found: ignore
      - name: Script corpus vs bash --posix + leak check
        run: tests/run_scripts.sh
      # The same cases against what we SHIP. The job above builds debug+ASan,
      # so until this existed nothing ran the golden suite against a release
      # binary -- and a heap bug the sanitizer happened to render benign
      # passed 3790/3790 while the optimised build segfaulted on `V=1 cmd`.
      # Optimisation and the sanitizer disagree about uninitialised stack;
      # one run cannot stand in for the other.
      - name: Golden suite against the RELEASE build
        run: |
          make test-release 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' \
            | tee release.log | grep -E 'PASSED|FAIL' | tail -3
          grep -q 'ALL [0-9]* TESTS PASSED' release.log || {
            echo "::error::The release build fails cases the debug build passes"
            exit 1; }
      # The suite diffs hellish against bash byte-for-byte, so anything that
      # steers bash steers the verdict -- and the people most likely to run it
      # are the people whose rc exports the most. A ~/.hellishrc framework
      # exporting HISTTIMEFORMAT once failed 12 issue42_history_opts cases
      # against code that was correct. tests/tester now unsets the variables
      # that reach the constructs under test; this step is what keeps that
      # true, by running the whole suite under a deliberately hostile
      # environment. CI is otherwise the ONE machine where the bug cannot
      # reproduce, which is exactly how the isolation would rot.
      - name: Suite survives a polluted developer environment
        env:
          HISTTIMEFORMAT: '%F %T '
          HISTCONTROL: ignoredups:ignorespace:erasedups
          HISTSIZE: '20000'
          HISTFILESIZE: '20000'
          HISTIGNORE: 'ls:cd:pwd'
          CDPATH: /tmp
          GLOBIGNORE: '*.o'
          PROMPT_COMMAND: 'true'
        run: |
          cd tests
          ./tester 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee ../dirty.log \
            | grep -E 'PASSED|FAIL' | tail -3
          grep -q 'ALL [0-9]* TESTS PASSED' ../dirty.log || {
            echo "::error::A polluted environment changed the verdict -- tests/tester is not isolating it"
            exit 1; }

  # ── Everything the golden suite cannot express ───────────────────────────
  # The golden suite diffs stdout+status of one-line cases. A lot of this
  # shell's behaviour is not shaped like that: startup argv parsing, the
  # login-shell file order, the help table, the release/update config. These
  # ran only on developer machines before, which is exactly how they rot.
  gates:
    name: Gates · cli + login + install + help + cd + update-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev
      - uses: ./.github/actions/oracle
      - name: Build
        run: make re > build.log 2>&1 || { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log | tail -80; exit 1; }
      - name: Startup argv parsing (-e, -o name, +c, --, $-, --version)
        run: make cli-opts-test
      - name: Login shell startup file order
        run: make login-test
      # The no-sudo install route, against a temporary $HOME. It installed the
      # binary and exec'd it by absolute path, so the shell came up while its
      # own NAME resolved nowhere: `hellish update` and `command -v hellish`
      # answered "command not found" on a machine that had just installed it.
      # Also runs inside `make pty-test` by discovery; named here because it
      # gates the INSTALLER, which no shell-behaviour job would ever reach.
      - name: user-install leaves `hellish` on PATH
        run: make user-install-test
      - name: help builtin covers every dispatched builtin
        run: make help-test
      - name: cd POSIX-mode operand handling
        run: make cd-posix-test
      - name: Release/update configuration agrees across channels
        run: make update-config-test

  # ── pty-driven behaviour ─────────────────────────────────────────────────
  # Interactive behaviour only exists in front of a terminal: readline, the
  # prompt, history joining, job control's use of the tty. Each of these
  # drives a real pty. They are the gates most likely to catch a regression
  # a user would actually notice, and the least likely to be run by hand.
  interactive:
    name: Interactive · pty gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev python3
      - uses: ./.github/actions/oracle
      - name: Build
        run: make re > build.log 2>&1 || { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log | tail -80; exit 1; }
      # ONE step, by discovery. This job used to name each tests/*.py file in
      # its own step, and a file nobody remembered to add here simply never
      # ran in CI -- which is what happened to completion_posix_test.py. The
      # runner globs the directory, so a new regression test is covered the
      # moment it is written, with no second place to remember.
      - name: Every pty regression test (tests/*.py, discovered)
        run: make pty-test
      # The other half of the same bug. These tests spawn INTERACTIVE shells,
      # which source ~/.hellishrc -- so on the machine of anyone who actually
      # uses hellish (this project's whole audience) their own config loads
      # into the shell under test and the prompt gates diff against a personal
      # PS1. Observed on a developer box: 4 spurious failures with a real
      # $HOME, 0 with a clean one. CI's $HOME is empty, so CI is the one
      # machine where it cannot reproduce -- hence this step, which plants a
      # hostile rc first and expects the suite to be unmoved by it.
      - name: pty suite ignores a hostile ~/.hellishrc
        run: |
          printf '%s\n' \
            'PS1="HOSTILE-PROMPT> "' \
            'PS2="HOSTILE2> "' \
            'alias ls="echo hijacked"' \
            'HISTTIMEFORMAT="%F %T "' > "$HOME/.hellishrc"
          make pty-test
          rm -f "$HOME/.hellishrc"
      - name: Multi-line history, both modes, vs the pinned bash
        run: make history-matrix-test

  # ── The other allocator, and the checks a pty cannot make ────────────────
  # SAFE=0 links the custom ft_malloc heap. ASan and valgrind are BLIND to
  # it, so HELLISH_ALLOC_STATS is the only leak detector that backend has --
  # and it is not redundant with the ASan job: LeakSanitizer reports neither
  # of the two unbounded leaks found on 2026-08-30 (the alias table and the
  # command-hash cache), because both are still reachable through t_shell at
  # exit and LSan classes that as "still reachable" rather than leaked. One
  # allocator cannot stand in for the other, the same way debug cannot stand
  # in for release.
  allocator:
    name: ft_malloc parity + prompt width
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev python3
      - uses: ./.github/actions/oracle
      - name: Build release on the ft_malloc heap
        run: |
          rm -f build/bin/hellish
          make MODE=release SAFE=0 all > build.log 2>&1 \
            || { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log | tail -80; exit 1; }
      # A shell that runs a command and defines an alias must end where it
      # started. Both of the leaks above scaled linearly with exactly these,
      # so a fixed budget is enough to catch the shape.
      - name: Nothing accumulates per alias or per external command
        run: |
          B=$(HELLISH_ALLOC_STATS=1 ./build/bin/hellish -c 'true' 2>&1 >/dev/null \
                | grep -oE '[0-9]+$' | tail -1)
          for n in 1 200; do
            S=""; i=0
            while [ $i -lt $n ]; do S="$S alias a$i='echo $i';"; i=$((i+1)); done
            V=$(HELLISH_ALLOC_STATS=1 ./build/bin/hellish -c "$S true" 2>&1 >/dev/null \
                  | grep -oE '[0-9]+$' | tail -1)
            echo "aliases=$n live=$V baseline=$B"
            [ "$V" = "$B" ] || { echo "::error::$n aliases leaked $((V-B)) bytes"; exit 1; }
          done
          V=$(HELLISH_ALLOC_STATS=1 ./build/bin/hellish -c \
                'for c in $(ls /usr/bin | head -40); do command -v $c >/dev/null; done' \
                2>&1 >/dev/null | grep -oE '[0-9]+$' | tail -1)
          echo "40 externals live=$V baseline=$B"
          [ "$V" = "$B" ] || { echo "::error::the command hash leaked $((V-B)) bytes"; exit 1; }
      - name: Every pty regression test, on the ft_malloc heap
        run: make pty-test
      # Linked directly, because the prompt width is never printed and no
      # shell command reveals it -- the pty case that inferred it from wrap
      # behaviour passed against a binary that still had the bug.
      - name: Prompt width model (CSI, OSC, guards, wide glyphs)
        run: make prompt-width-test
      # Twelve real plugins. Skips cleanly with no network, so this step is a
      # bonus on a connected runner and never a flake on one without.
      - name: Real third-party plugins
        run: python3 tests/plugin_corpus_test.py build/bin/hellish

  # ── Update path and network-shaped redirections ──────────────────────────
  # Both bring up their own local peer; neither touches the network. The
  # update suite is the one that matters most to users -- it is the code
  # that replaces the binary on their machine.
  update:
    name: Update path + /dev/tcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev python3
      - uses: ./.github/actions/oracle
      - name: Build
        run: make re > build.log 2>&1 || { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log | tail -80; exit 1; }
      - name: Update path against a local fake release server
        run: make update-test
      - name: /dev/tcp and /dev/udp redirections
        run: make net-redir-test

  # ── Whole-program corpus and allocator parity ────────────────────────────
  # tests/hard/ holds programs too large for a one-line golden case, and has
  # its own runner that `make test` does not invoke. verify_alloc proves the
  # two compile-time heaps produce identical output and leak nothing --
  # ft_malloc is invisible to ASan, so this is the only oracle it has.
  corpus:
    name: Hard corpus + allocator parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev python3
      - uses: ./.github/actions/oracle
      - name: Build
        run: make re > build.log 2>&1 || { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log | tail -80; exit 1; }
      - name: Whole-program corpus vs bash --posix
        run: bash tests/hard/run.sh
      - name: Both heaps agree, and neither leaks
        run: cd tests && ./verify_alloc.sh
      # Builds SAFE=0 itself: a cross-heap free cannot exist on SAFE=1,
      # where xmalloc and readline's free() are the same allocator.
      - name: Tab completion on the ft_malloc heap
        run: make completion-test
      # Rebuilds with 512-byte arena chunks so the allocator's rare states
      # (chunk boundaries, registry-full heap fallback) happen every few
      # nodes — the #94 double free could only ever fire in those states.
      # Runs last: it leaves the object tree fclean'd.
      - name: Arena chunk-boundary stress (ASan)
        run: make arena-stress

  # ── Benchmarks: measured, reported, never a gate ─────────────────────────
  # Shared CI runners are noisy neighbours; timings there cannot decide
  # pass/fail without producing flaky red builds. So this job measures and
  # publishes the numbers as an artifact for tracking, and is allowed to
  # fail without blocking the merge. Trend, not threshold.
  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev python3 hyperfine || true
      - uses: ./.github/actions/oracle
      - name: Speed vs bash --posix
        run: make bench ROUNDS=3 2>&1 | tee bench-out.txt | tail -40
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-out.txt
            bench/results.md
            bench/conformance.md
          if-no-files-found: ignore
          retention-days: 30
