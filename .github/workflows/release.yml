name: release

# Cut a release by pushing a tag:  git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binary:
    name: build binary + GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The published asset is the STATIC musl binary, not `make OPT=1 all`.
      #
      # This job used to build against the runner's own glibc and readline and
      # ship that. The result needed libreadline.so.8 and GLIBC_2.34, so the
      # binary `install.sh` and the shell's own updater hand out did not run
      # on:
      #   * Debian 11 / Ubuntu 20.04 / RHEL 8 -- glibc too old:
      #       libc.so.6: version `GLIBC_2.34' not found
      #   * a stock ubuntu:24.04 -- the distro it was BUILT on -- because
      #     libreadline8 is not installed by default:
      #       error while loading shared libraries: libreadline.so.8
      # Measured on the published v2.7.6 asset, not inferred.
      #
      # `make static` already existed and solves both: no interpreter, no
      # shared deps, verified running on debian:11-slim, ubuntu:24.04 and
      # alpine. The updater catches an unrunnable download (step 4) and
      # refuses rather than installing it, so this was never a corruption
      # risk -- it was users stuck with no way forward, which is issue #76's
      # title.
      - name: Build the static release binary
        run: make static-verify
      # The asset NAME is load-bearing and must not change: every installed
      # hellish computes it as "hellish-linux-" + uname -m (x86_64), while
      # `make static` names its output by docker's platform (amd64). Renaming
      # the asset would 404 the updater on every machine already out there.
      - name: Stage release binary + checksum
        run: |
          cp dist/hellish-linux-amd64 hellish-linux-x86_64
          file hellish-linux-x86_64
          sha256sum hellish-linux-x86_64 > hellish-linux-x86_64.sha256
          cat hellish-linux-x86_64.sha256
      # The install bundle: the proven install drivers, shipped beside the
      # binary so `curl | sh` reuses them instead of reimplementing preflight,
      # smoke-testing and never-clobber seeding. Layout mirrors the repo,
      # because the scripts locate each other relatively (tools/../share).
      - name: Stage the install bundle
        run: |
          set -eux
          mkdir -p bundle/tools
          cp user-install.sh hellishrc.example bundle/
          cp tools/register_shell.sh tools/seed_hellishrc.sh bundle/tools/
          cp -R share bundle/share
          tar -czf hellish-install-bundle.tar.gz -C bundle .
          tar -tzf hellish-install-bundle.tar.gz | head
      # Proves the asset runs where the old one could not, before it is
      # published rather than after someone reports that it does not.
      - name: The asset runs on an old glibc and with no readline
        run: |
          set -eux
          docker run --rm -v "$PWD/hellish-linux-x86_64:/h:ro" debian:11-slim \
            /h -c 'echo ok $((20 + 22))'
          docker run --rm -v "$PWD/hellish-linux-x86_64:/h:ro" ubuntu:24.04 \
            /h -c 'echo ok $((20 + 22))'
          docker run --rm -v "$PWD/hellish-linux-x86_64:/h:ro" alpine:latest \
            /h -c 'echo ok $((20 + 22))'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hellish-linux-x86_64
            hellish-linux-x86_64.sha256
            hellish-install-bundle.tar.gz
          generate_release_notes: true
          # A tag carrying a pre-release suffix must never become "latest":
          # the update check reads /releases/latest, so publishing a test
          # build as a full release would tell every installed hellish to
          # downgrade. contains('-') is the semver rule for a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    name: publish to npm (needs NPM_TOKEN)
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish (skips if NPM_TOKEN unset)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."; exit 0
          fi
          cd npm
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm publish --access public

  # Docker Hub is a SECONDARY channel: GHCR already publishes the image from
  # its own workflow using GITHUB_TOKEN, and the GitHub release asset is what
  # the shell's own updater fetches. So a Docker Hub problem must not paint
  # the release red -- v2.6.0 shipped its binary, its checksum and its GHCR
  # image correctly and still reported failure, because the Docker Hub
  # personal access token had expired:
  #
  #   unauthorized: personal access token is expired
  #
  # A release run that is permanently red is worse than no signal at all:
  # the next genuine failure looks identical to this one and gets shrugged
  # off. continue-on-error keeps the failure visible as a warning on the job
  # while the run's conclusion reflects the channels that actually matter.
  # (The token still needs rotating -- this makes the breakage legible, it
  # does not fix it.)
  docker:
    name: build + push image (Docker Hub, optional)
    needs: binary
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Guard
        id: guard
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOK: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${USER:-}" ] || [ -z "${TOK:-}" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_* not set — skipping docker push."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.guard.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        if: steps.guard.outputs.go == 'true'
        run: |
          # The multi-stage docker/Dockerfile.release compiles hellish itself
          # (no pre-build / readline-dev install needed on the runner) and ships
          # a small, self-contained glibc image.
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/hellish-shell"
          V="${GITHUB_REF_NAME#v}"
          docker build -f docker/Dockerfile.release -t "$IMG:$V" -t "$IMG:latest" .
          docker push "$IMG:$V"
          docker push "$IMG:latest"
