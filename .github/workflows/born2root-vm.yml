# born2root + Inception, end to end, from hellish, on both hypervisors.
#
# A human whose login shell is hellish types `make all` in born2root and gets
# a Debian guest with hellish inside; `make inception` then deploys the docker
# stack in that guest with Inception's Makefile running under hellish, and
# Inception's compliance suite runs there under hellish and under /bin/sh and
# must agree. tests/born2root_build.sh drives it, docker/Dockerfile.born2root
# is the machine: hellish installed as the login shell, /bin/bash a tripwire
# that fails the run if born2root or Inception ran anything under bash.
#
# The hypervisor's driver is the runner's (a container cannot load modules):
# GitHub's Linux runners expose /dev/kvm; for VirtualBox the runner installs
# Ubuntu's package (module + matching userland in the image). One hypervisor
# per job -- they cannot share VT-x -- so the two run on separate runners.
#
# Forty minutes and a Debian mirror per job, so this is not part of ci.yml:
# weekly and on demand. The per-push gates are born2root_check.sh and
# inception_check.sh in the CI tests job.
name: born2root VM

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC

permissions:
  contents: read

jobs:
  vm:
    name: ${{ matrix.backend }} · guest built from hellish, Inception inside
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [qemu, virtualbox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: KVM for the runner
        if: matrix.backend == 'qemu'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: VirtualBox driver on the runner
        if: matrix.backend == 'virtualbox'
        run: |
          sudo apt-get update
          sudo apt-get install -y virtualbox
          # AMD-V belongs to one hypervisor at a time, and the runner image
          # arrives with kvm_amd already loaded and nested=1 -- it owns the
          # extension before anything of ours runs, so every VBoxManage
          # startvm here died with
          #   VirtualBox can't enable the AMD-V extension. Please disable
          #   the KVM kernel extension (VERR_SVM_IN_USE)
          # forty minutes into the job, at the guest's OS install. Unloading
          # the CPU module hands it back; `kvm` itself stays, because
          # Ubuntu's vboxdrv links against it.
          sudo modprobe -r kvm_amd kvm_intel || true
          sudo modprobe vboxdrv || sudo /sbin/vboxconfig
          if lsmod | grep -qE '^(kvm_amd|kvm_intel) '; then
            echo "KVM still holds the CPU extension; VirtualBox cannot run here" >&2
            exit 1
          fi
          ls -l /dev/vboxdrv /dev/vboxdrvu
          VBoxManage --version
      # Forty minutes of ISO and installer before the first VM is started is
      # the worst possible place to find out that this runner cannot start
      # one. Ask now, with a machine that boots nothing: it either powers on
      # or it says why in under a minute.
      - name: A VM can actually be powered on here
        if: matrix.backend == 'virtualbox'
        timeout-minutes: 8
        run: |
          # Every call is bounded. This check takes one second when
          # VirtualBox is healthy, and on one runner VBoxManage simply never
          # came back -- the step sat there for 42 minutes and would have
          # eaten the job's whole two-hour budget, which is the opposite of
          # what a preflight is for. A wedged VBoxSVC is also the one thing
          # worth retrying: it is restarted, the driver reloaded, and the
          # question asked once more before the leg gives up.
          probe() {
            timeout 60 VBoxManage createvm --name preflight --ostype Debian_64 --register || return 1
            timeout 60 VBoxManage modifyvm preflight --memory 512 --nic1 nat || return 1
            timeout 120 VBoxManage startvm preflight --type headless || return 1
            timeout 60 VBoxManage showvminfo preflight --machinereadable \
              | grep -E '^VMState="running"' || return 1
          }
          clean() {
            timeout 60 VBoxManage controlvm preflight poweroff > /dev/null 2>&1 || true
            timeout 60 VBoxManage unregistervm preflight --delete > /dev/null 2>&1 || true
          }
          if probe; then clean; exit 0; fi
          echo "preflight failed; restarting VBoxSVC and the driver, then one retry" >&2
          clean
          pkill -f VBoxSVC || true
          sudo modprobe -r vboxdrv || true
          sudo modprobe vboxdrv || sudo /sbin/vboxconfig || true
          sleep 5
          if probe; then clean; exit 0; fi
          clean
          echo "VirtualBox cannot power on a VM on this runner" >&2
          exit 1
      - name: Cache the Debian netinst ISO
        uses: actions/cache@v4
        with:
          path: ~/.cache/born2root
          key: debian-netinst-${{ runner.os }}-v1
      - name: Static hellish for the guest
        run: make static
      - name: Build the image and run the build inside it
        run: |
          make born2root-docker BORN2ROOT_BACKEND=${{ matrix.backend }} 2>&1 | tee born2root-docker.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: born2root-${{ matrix.backend }}-logs
          path: born2root-docker.log
          if-no-files-found: ignore
