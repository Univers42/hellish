<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="Speedup vs bash --posix, per dimension">
<style>
  .bg{fill:#ffffff}
  .card{fill:#f6f8fa;stroke:#d0d7de}
  .title{fill:#1f2328;font:600 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .sub{fill:#59636e;font:400 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .lbl{fill:#1f2328;font:500 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .val{fill:#1f2328;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .muted{fill:#59636e;font:400 10.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .grid{stroke:#d8dee4;stroke-width:1}
  .axis{stroke:#8c959f;stroke-width:1}
  .warn{fill:#9a6700;font:600 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .warnbox{fill:#fff8c5;stroke:#d4a72c}
  .win{fill:#1a7f37;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .lose{fill:#cf222e;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .tie{fill:#59636e;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .card{fill:#161b22;stroke:#30363d}
    .title{fill:#e6edf3}
    .sub{fill:#9198a1}
    .lbl{fill:#e6edf3}
    .val{fill:#e6edf3}
    .muted{fill:#9198a1}
    .grid{stroke:#30363d}
    .axis{stroke:#6e7681}
    .warn{fill:#d29922}
    .warnbox{fill:#282215;stroke:#9e6a03}
    .win{fill:#3fb950}
    .lose{fill:#f85149}
    .tie{fill:#9198a1}
  }
</style>
<rect class="bg" width="880" height="430" rx="8"/>
<text class="title" x="20" y="30">Speedup vs bash --posix, per dimension</text>
<text class="sub" x="20" y="50">Bar = bash median / hellish median. Right of centre means hellish is faster. Hatched bars were too noisy to trust.</text>
<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#000" opacity="0.001"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/></pattern></defs>
<rect x="20.0" y="66.0" width="840.0" height="24.0" rx="5" class="warnbox" opacity="1.00"/>
<text class="warn" x="30.0" y="82.0" text-anchor="start">PROVISIONAL — CPU governor was &quot;powersave&quot;, not &quot;performance&quot;.</text>
<line class="grid" x1="210.0" y1="116.0" x2="210.0" y2="390.0"/>
<text class="muted" x="210.0" y="404.0" text-anchor="middle">0.11x</text>
<line class="grid" x1="348.5" y1="116.0" x2="348.5" y2="390.0"/>
<text class="muted" x="348.5" y="404.0" text-anchor="middle">0.33x</text>
<line class="axis" x1="487.0" y1="116.0" x2="487.0" y2="390.0"/>
<text class="muted" x="487.0" y="404.0" text-anchor="middle">1x</text>
<line class="grid" x1="625.5" y1="116.0" x2="625.5" y2="390.0"/>
<text class="muted" x="625.5" y="404.0" text-anchor="middle">3.02x</text>
<line class="grid" x1="764.0" y1="116.0" x2="764.0" y2="390.0"/>
<text class="muted" x="764.0" y="404.0" text-anchor="middle">9.11x</text>
<text class="muted" x="487.0" y="110.0" text-anchor="middle">parity</text>
<text class="muted" x="210.0" y="110.0" text-anchor="start">← hellish slower</text>
<text class="muted" x="764.0" y="110.0" text-anchor="end">hellish faster →</text>
<rect x="487.0" y="124.0" width="50.2" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="124.0" width="50.2" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="136.0" text-anchor="end">Arith loop</text>
<text class="win" x="545.2" y="136.0" text-anchor="start">1.49x  (noisy)</text>
<rect x="487.0" y="150.0" width="240.9" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="150.0" width="240.9" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="162.0" text-anchor="end">String concat</text>
<text class="win" x="735.9" y="162.0" text-anchor="start">6.83x  (noisy)</text>
<rect x="487.0" y="176.0" width="50.2" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="176.0" width="50.2" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="188.0" text-anchor="end">Colon loop</text>
<text class="win" x="545.2" y="188.0" text-anchor="start">1.49x  (noisy)</text>
<rect x="487.0" y="202.0" width="85.1" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="202.0" width="85.1" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="214.0" text-anchor="end">Read loop</text>
<text class="win" x="580.1" y="214.0" text-anchor="start">1.97x  (noisy)</text>
<rect x="487.0" y="228.0" width="85.1" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="228.0" width="85.1" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="240.0" text-anchor="end">Cmdsub `$(true)`</text>
<text class="win" x="580.1" y="240.0" text-anchor="start">1.97x  (noisy)</text>
<rect x="464.2" y="254.0" width="22.8" height="15.0" rx="2" fill="#8b95a1" opacity="0.55"/>
<rect x="464.2" y="254.0" width="22.8" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="266.0" text-anchor="end">Cmdsub `$(/bin/true)`</text>
<text class="lose" x="456.2" y="266.0" text-anchor="end">0.83x  (noisy)</text>
<rect x="487.0" y="280.0" width="10.9" height="15.0" rx="2" fill="#e2543a" opacity="0.55"/>
<rect x="487.0" y="280.0" width="10.9" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="292.0" text-anchor="end">3-stage pipeline</text>
<text class="win" x="505.9" y="292.0" text-anchor="start">1.09x  (noisy)</text>
<rect x="399.2" y="306.0" width="87.8" height="15.0" rx="2" fill="#8b95a1" opacity="1.00"/>
<text class="lbl" x="200.0" y="318.0" text-anchor="end">autoconf configure</text>
<text class="lose" x="391.2" y="318.0" text-anchor="end">0.50x</text>
<rect x="401.9" y="332.0" width="85.1" height="15.0" rx="2" fill="#8b95a1" opacity="0.55"/>
<rect x="401.9" y="332.0" width="85.1" height="15.0" rx="2" fill="url(#hatch)" opacity="1.00"/>
<text class="lbl" x="200.0" y="344.0" text-anchor="end">Parse 50k lines</text>
<text class="lose" x="393.9" y="344.0" text-anchor="end">0.51x  (noisy)</text>
<rect x="486.9" y="358.0" width="0.1" height="15.0" rx="2" fill="#8b95a1" opacity="1.00"/>
<text class="lbl" x="200.0" y="370.0" text-anchor="end">Startup</text>
<text class="tie" x="478.9" y="370.0" text-anchor="end">1.00x</text>
<text class="muted" x="20.0" y="418.0" text-anchor="start">Linux-7.0.0-27-generic-x86_64  ·  governor=powersave</text>
</svg>
