<svg xmlns="http://www.w3.org/2000/svg" width="683" height="377" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<rect width="100%" height="100%" rx="8" fill="#1e2127"/>
<circle cx="22" cy="20" r="6" fill="#e05561"/><circle cx="42" cy="20" r="6" fill="#d18f52"/><circle cx="62" cy="20" r="6" fill="#8cc265"/>
<text x="50%" y="25" text-anchor="middle" fill="#72767d">hellish — hxp list</text>
<text y="54" xml:space="preserve"></text>
<text y="73" xml:space="preserve"><tspan x="14.0" fill="#ff875f" font-weight="bold">plugins</tspan></text>
<text y="92" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">devkit    </tspan><tspan x="148.4" fill="#d7dae0"> devkit: project detection, universal run/build/test/fmt/lint</tspan></text>
<text y="111" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">docker    </tspan><tspan x="148.4" fill="#d7dae0"> docker: container/image overview, shell-in, prune, compose</tspan></text>
<text y="130" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">forge     </tspan><tspan x="148.4" fill="#d7dae0"> forge (official): scaffold, lint and document plugins</tspan></text>
<text y="149" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git       </tspan><tspan x="148.4" fill="#d7dae0"> git: repo status, safe undo, wip commits, branch cleanup</tspan></text>
<text y="168" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git-completion</tspan><tspan x="182.0" fill="#d7dae0"> git&#x27;s own TAB completion (needs shopt -s progcomp)</tspan></text>
<text y="187" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git-prompt</tspan><tspan x="148.4" fill="#d7dae0"> __git_ps1 for your prompt</tspan></text>
<text y="206" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">jump      </tspan><tspan x="148.4" fill="#d7dae0"> jump: frecency directory jumping, bookmarks, back-stack</tspan></text>
<text y="225" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">net       </tspan><tspan x="148.4" fill="#d7dae0"> net: ports, local/public IP, DNS, HTTP probing, port waiting</tspan></text>
<text y="244" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-colored-man-pages</tspan><tspan x="240.8" fill="#d7dae0"> man pages in colour</tspan></text>
<text y="263" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-dirhistory</tspan><tspan x="182.0" fill="#d7dae0"> Alt-Left/Alt-Right walk your cd history</tspan></text>
<text y="282" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-extract</tspan><tspan x="156.8" fill="#d7dae0"> the extract command opens any archive</tspan></text>
<text y="301" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-sudo  </tspan><tspan x="148.4" fill="#d7dae0"> ESC-ESC prepends sudo to the line</tspan></text>
<text y="320" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">sentinel  </tspan><tspan x="148.4" fill="#d7dae0"> sentinel: system dashboard, disk/load/memory watch, repo scan</tspan></text>
<text y="339" xml:space="preserve"></text>
<text y="358" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">hxp info &lt;name&gt; for detail - conf on|off &lt;name&gt; to toggle</tspan></text>
</svg>