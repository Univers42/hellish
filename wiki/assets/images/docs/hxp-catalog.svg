<svg xmlns="http://www.w3.org/2000/svg" width="775" height="472" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<rect width="100%" height="100%" rx="8" fill="#1e2127"/>
<circle cx="22" cy="20" r="6" fill="#e05561"/><circle cx="42" cy="20" r="6" fill="#d18f52"/><circle cx="62" cy="20" r="6" fill="#8cc265"/>
<text x="50%" y="25" text-anchor="middle" fill="#72767d">hellish — hxp catalog</text>
<text y="54" xml:space="preserve"></text>
<text y="73" xml:space="preserve"><tspan x="14.0" fill="#ff875f" font-weight="bold">catalog</tspan></text>
<text y="92" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git                   </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> repo status, safe undo, wip commits, branch cleanup</tspan></text>
<text y="111" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">jump                  </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> frecency directory jumping (j, marks)</tspan></text>
<text y="130" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">devkit                </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> build/run helpers for C and 42 projects</tspan></text>
<text y="149" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">docker                </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> container shortcuts and cleanup</tspan></text>
<text y="168" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">net                   </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> ip, ports, http serve, speed checks</tspan></text>
<text y="187" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">sentinel              </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> greeting + system report</tspan></text>
<text y="206" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">forge                 </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">builtin </tspan><tspan x="324.8" fill="#d7dae0"> write and scaffold your own plugins (hxp new)</tspan></text>
<text y="225" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-sudo              </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> ESC-ESC prepends sudo to the line</tspan></text>
<text y="244" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-extract           </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> the extract command opens any archive</tspan></text>
<text y="263" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-dirhistory        </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> Alt-Left/Alt-Right walk your cd history</tspan></text>
<text y="282" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-colored-man-pages </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> man pages in colour</tspan></text>
<text y="301" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">off</tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-copypath          </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> copy the cwd to the clipboard</tspan></text>
<text y="320" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">off</tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-jsontools         </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> pretty-print and validate JSON</tspan></text>
<text y="339" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">off</tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">omz-web-search        </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">zsh     </tspan><tspan x="324.8" fill="#d7dae0"> search the web from the prompt (google foo)</tspan></text>
<text y="358" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git-completion        </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">sh      </tspan><tspan x="324.8" fill="#d7dae0"> git&#x27;s own TAB completion (needs shopt -s progcomp)</tspan></text>
<text y="377" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#8cc265">on </tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">git-prompt            </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">sh      </tspan><tspan x="324.8" fill="#d7dae0"> __git_ps1 for your prompt</tspan></text>
<text y="396" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">off</tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">bash-preexec          </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">sh      </tspan><tspan x="324.8" fill="#d7dae0"> preexec/precmd hooks, bash style</tspan></text>
<text y="415" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">off</tspan><tspan x="56.0" fill="#d7dae0"> </tspan><tspan x="64.4" fill="#d7dae0" font-weight="bold">z                     </tspan><tspan x="249.2" fill="#d7dae0"> </tspan><tspan x="257.6" fill="#72767d">sh      </tspan><tspan x="324.8" fill="#d7dae0"> the classic frecency jumper</tspan></text>
<text y="434" xml:space="preserve"></text>
<text y="453" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#72767d">hxp install &lt;name&gt; to fetch an external one</tspan></text>
</svg>