<text y="358" xml:space="preserve"><tspan x="14.0" fill="#42b3c2" font-weight="bold">hellish-plugins:</tspan><tspan x="148.4" fill="#d7dae0"> pick your plugins (Enter takes the default):</tspan></text>
<text y="377" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">git                   </tspan><tspan x="215.6" fill="#d7dae0"> repo status, safe undo, wip commits, branch cleanup [Y/n]   </tspan><tspan x="728.0" fill="#d7dae0" font-weight="bold">jump                  </tspan><tspan x="912.8" fill="#d7dae0"> frecency directory jumping (j, marks) [Y/n]   </tspan><tspan x="1307.6" fill="#d7dae0" font-weight="bold">devkit                </tspan><tspan x="1492.4" fill="#d7dae0"> build/run helpers for C and 42 projects [Y/n]   </tspan><tspan x="1904.0" fill="#d7dae0" font-weight="bold">docker                </tspan><tspan x="2088.8" fill="#d7dae0"> container shortcuts and cleanup [Y/n]   </tspan><tspan x="2433.2" fill="#d7dae0" font-weight="bold">net                   </tspan><tspan x="2618.0" fill="#d7dae0"> ip, ports, http serve, speed checks [Y/n]   </tspan><tspan x="2996.0" fill="#d7dae0" font-weight="bold">sentinel              </tspan><tspan x="3180.8" fill="#d7dae0"> greeting + system report [Y/n]   </tspan><tspan x="3466.4" fill="#d7dae0" font-weight="bold">forge                 </tspan><tspan x="3651.2" fill="#d7dae0"> write and scaffold your own plugins (hxp new) [Y/n]   </tspan><tspan x="4113.2" fill="#d7dae0" font-weight="bold">omz-sudo              </tspan><tspan x="4298.0" fill="#d7dae0"> ESC-ESC prepends sudo to the line [Y/n]   </tspan><tspan x="4659.2" fill="#d7dae0" font-weight="bold">omz-extract           </tspan><tspan x="4844.0" fill="#d7dae0"> the extract command opens any archive [Y/n]   </tspan><tspan x="5238.8" fill="#d7dae0" font-weight="bold">omz-dirhistory        </tspan><tspan x="5423.6" fill="#d7dae0"> Alt-Left/Alt-Right walk your cd history [Y/n]   </tspan><tspan x="5835.2" fill="#d7dae0" font-weight="bold">omz-colored-man-pages </tspan><tspan x="6020.0" fill="#d7dae0"> man pages in colour [Y/n]   </tspan><tspan x="6263.6" fill="#d7dae0" font-weight="bold">omz-copypath          </tspan><tspan x="6448.4" fill="#d7dae0"> copy the cwd to the clipboard [y/N]   </tspan><tspan x="6776.0" fill="#d7dae0" font-weight="bold">omz-jsontools         </tspan><tspan x="6960.8" fill="#d7dae0"> pretty-print and validate JSON [y/N]   </tspan><tspan x="7296.8" fill="#d7dae0" font-weight="bold">omz-web-search        </tspan><tspan x="7481.6" fill="#d7dae0"> search the web from the prompt (google foo) [y/N]   </tspan><tspan x="7926.8" fill="#d7dae0" font-weight="bold">git-completion        </tspan><tspan x="8111.6" fill="#d7dae0"> git&#x27;s own TAB completion (needs shopt -s progcomp) [Y/n]   </tspan><tspan x="8615.6" fill="#d7dae0" font-weight="bold">git-prompt            </tspan><tspan x="8800.4" fill="#d7dae0"> __git_ps1 for your prompt [Y/n]   </tspan><tspan x="9094.4" fill="#d7dae0" font-weight="bold">bash-preexec          </tspan><tspan x="9279.2" fill="#d7dae0"> preexec/precmd hooks, bash style [y/N]   </tspan><tspan x="9632.0" fill="#d7dae0" font-weight="bold">z                     </tspan><tspan x="9816.8" fill="#d7dae0"> the classic frecency jumper [y/N] </tspan><tspan x="10110.8" fill="#42b3c2" font-weight="bold">hellish-plugins:</tspan><tspan x="10245.2" fill="#d7dae0"> installed -&gt; /tmp/claude-1000/-home-dlesieur-hellish/c988eb41-e364-479e-be2d-5343a5c4a450/scratchpad/fakehome4/.hellish</tspan></text>
<text y="396" xml:space="preserve"><tspan x="14.0" fill="#42b3c2" font-weight="bold">hellish-plugins:</tspan><tspan x="148.4" fill="#d7dae0"> plugins on: git jump devkit docker net sentinel forge omz-sudo omz-extract omz-dirhistory git-completion git-prompt</tspan></text>
<text y="415" xml:space="preserve"><tspan x="14.0" fill="#42b3c2" font-weight="bold">hellish-plugins:</tspan><tspan x="148.4" fill="#d7dae0"> open a new shell, then: conf list · hxp list · help_conf</tspan></text>
</svg>