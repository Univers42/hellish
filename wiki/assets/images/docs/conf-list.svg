<text x="50%" y="25" text-anchor="middle" fill="#72767d">hellish — conf list (first screen)</text>
<text y="54" xml:space="preserve"></text>
<text y="73" xml:space="preserve"><tspan x="14.0" fill="#ff875f" font-weight="bold">features</tspan></text>
<text y="92" xml:space="preserve"></text>
<text y="111" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#ff875f">core</tspan></text>
<text y="130" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">aliases       </tspan><tspan x="198.8" fill="#d7dae0"> the alias set: ls, git, safety nets, navigation</tspan></text>
<text y="149" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">completion    </tspan><tspan x="198.8" fill="#d7dae0"> completion registry (hellish cannot install completions yet)</tspan></text>
<text y="168" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">env           </tspan><tspan x="198.8" fill="#d7dae0"> environment variables, PATH hygiene, editor and pager defaults</tspan></text>
<text y="187" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">forge         </tspan><tspan x="198.8" fill="#d7dae0"> forge (official): scaffold, lint and document plugins</tspan></text>
<text y="206" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">functions     </tspan><tspan x="198.8" fill="#d7dae0"> everyday functions: navigation, archives, search, shims</tspan></text>
<text y="225" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">history       </tspan><tspan x="198.8" fill="#d7dae0"> history file, size, and recall behaviour</tspan></text>
<text y="244" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">local         </tspan><tspan x="198.8" fill="#d7dae0"> machine-specific overrides, loaded last</tspan></text>
<text y="263" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">options       </tspan><tspan x="198.8" fill="#d7dae0"> shell options: set -o flags, pretty presets, glob knobs</tspan></text>
<text y="282" xml:space="preserve"></text>
