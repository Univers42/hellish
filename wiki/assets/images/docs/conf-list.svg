<text y="377" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">git           </tspan><tspan x="198.8" fill="#d7dae0"> git: repo status, safe undo, wip commits, branch cleanup</tspan></text>
<text y="396" xml:space="preserve"></text>
