<text y="434" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">devkit        </tspan><tspan x="198.8" fill="#d7dae0"> devkit: project detection, universal run/build/test/fmt/lint</tspan></text>
<text y="453" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">docker        </tspan><tspan x="198.8" fill="#d7dae0"> docker: container/image overview, shell-in, prune, compose</tspan></text>
<text y="472" xml:space="preserve"></text>
<text y="491" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#ff875f">nav</tspan></text>
<text y="510" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">jump          </tspan><tspan x="198.8" fill="#d7dae0"> jump: frecency directory jumping, bookmarks, back-stack</tspan></text>
<text y="529" xml:space="preserve"></text>
<text y="548" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#ff875f">net</tspan></text>
<text y="567" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">net           </tspan><tspan x="198.8" fill="#d7dae0"> net: ports, local/public IP, DNS, HTTP probing, port waiting</tspan></text>
<text y="586" xml:space="preserve"></text>
<text y="605" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#ff875f">sys</tspan></text>
<text y="624" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">sentinel      </tspan><tspan x="198.8" fill="#d7dae0"> sentinel: system dashboard, disk/load/memory watch, repo scan</tspan></text>
<text y="643" xml:space="preserve"></text>
<text y="662" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#ff875f">ai</tspan></text>
<text y="681" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#8cc265">on </tspan><tspan x="72.8" fill="#d7dae0"> </tspan><tspan x="81.2" fill="#d7dae0" font-weight="bold">ai            </tspan><tspan x="198.8" fill="#d7dae0"> the shipped AI block (inert on 2.7.6: no &#x27;ai&#x27; builtin)</tspan></text>
