<svg xmlns="http://www.w3.org/2000/svg" width="826" height="472" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<rect width="100%" height="100%" rx="8" fill="#1e2127"/>
<circle cx="22" cy="20" r="6" fill="#e05561"/><circle cx="42" cy="20" r="6" fill="#d18f52"/><circle cx="62" cy="20" r="6" fill="#8cc265"/>
<text x="50%" y="25" text-anchor="middle" fill="#72767d">hellish — hxp info git</text>
<text y="54" xml:space="preserve"></text>
<text y="73" xml:space="preserve"><tspan x="14.0" fill="#ff875f" font-weight="bold">git</tspan></text>
<text y="92" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">state                 </tspan><tspan x="215.6" fill="#d7dae0"> </tspan><tspan x="224.0" fill="#8cc265">on </tspan></text>
<text y="111" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">group                 </tspan><tspan x="215.6" fill="#d7dae0"> vcs</tspan></text>
<text y="130" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">purpose               </tspan><tspan x="215.6" fill="#d7dae0"> git: repo status, safe undo, wip commits, branch cleanup</tspan></text>
<text y="149" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">requires              </tspan><tspan x="215.6" fill="#d7dae0"> git</tspan></text>
<text y="168" xml:space="preserve"></text>
<text y="187" xml:space="preserve"><tspan x="14.0" fill="#ff875f">  provides</tspan></text>
<text y="206" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gbranch           </tspan><tspan x="257.6" fill="#d7dae0"> print the current branch name</tspan></text>
<text y="225" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gfind             </tspan><tspan x="257.6" fill="#d7dae0"> find commits that added or removed a string</tspan></text>
<text y="244" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">ginfo             </tspan><tspan x="257.6" fill="#d7dae0"> one-screen repository overview: branch, drift, counts, recent log</tspan></text>
<text y="263" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gnuke             </tspan><tspan x="257.6" fill="#d7dae0"> discard every local change (shows them and asks first)</tspan></text>
<text y="282" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">groot             </tspan><tspan x="257.6" fill="#d7dae0"> cd to the repository root</tspan></text>
<text y="301" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gsw               </tspan><tspan x="257.6" fill="#d7dae0"> switch to a branch, creating it if needed</tspan></text>
<text y="320" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gsweep            </tspan><tspan x="257.6" fill="#d7dae0"> delete local branches already merged into the default branch</tspan></text>
<text y="339" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gundo             </tspan><tspan x="257.6" fill="#d7dae0"> undo the last commit, keeping its changes staged</tspan></text>
<text y="358" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gunstage          </tspan><tspan x="257.6" fill="#d7dae0"> unstage everything, or the given paths</tspan></text>
<text y="377" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gunwip            </tspan><tspan x="257.6" fill="#d7dae0"> undo the last wip commit (refuses if it is not one)</tspan></text>
<text y="396" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gwhen             </tspan><tspan x="257.6" fill="#d7dae0"> history of one file, following renames</tspan></text>
<text y="415" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gwho              </tspan><tspan x="257.6" fill="#d7dae0"> commit counts per author</tspan></text>
<text y="434" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">func  </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">gwip              </tspan><tspan x="257.6" fill="#d7dae0"> commit everything as a timestamped wip (skips hooks)</tspan></text>
<text y="453" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">    </tspan><tspan x="47.6" fill="#72767d">var   </tspan><tspan x="98.0" fill="#d7dae0"> </tspan><tspan x="106.4" fill="#d7dae0" font-weight="bold">HX_GIT_AUTOINFO   </tspan><tspan x="257.6" fill="#d7dae0"> set to 1 to run ginfo automatically on entering a new repo</tspan></text>
</svg>