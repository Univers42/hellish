<text y="472" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">typeset   </tspan><tspan x="114.8" fill="#d7dae0"> typeset [-aAfFgiIlnrtux] [-p] [name[=value]...]</tspan></text>
<text y="491" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">local     </tspan><tspan x="114.8" fill="#d7dae0"> local [name[=value] ...]</tspan></text>
<text y="510" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">let       </tspan><tspan x="114.8" fill="#d7dae0"> let arg [arg ...]</tspan></text>
