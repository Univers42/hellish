<text y="415" xml:space="preserve"><tspan x="14.0" fill="#d7dae0">  </tspan><tspan x="30.8" fill="#d7dae0" font-weight="bold">readonly  </tspan><tspan x="114.8" fill="#d7dae0"> readonly [-p] [name[=value] ...]</tspan></text>
